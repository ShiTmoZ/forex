name: Multi-Asset Historical Training & Backtest (2020-2026)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "strategy.py"
      - "train_backtest_all.py"
      - "config.py"

permissions:
  contents: write

jobs:
  run-backtest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Multi-Asset 2020-2026 Backtest
        run: |
          python train_backtest_all.py

      - name: Upload Backtest Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: multi-asset-backtest-report
          path: multi_asset_backtest_report.json

      - name: Commit Backtest Results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add multi_asset_backtest_report.json
          git commit -m "chore(data): automated 2020-2026 multi-asset backtest results [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Push skipped"
